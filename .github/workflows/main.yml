name: marketingapp-web

on:

  push:

    branches:

      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code

        uses: actions/checkout@v3   #  updated version

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v2   #  updated

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: us-east-1

      - name: Deploy to S3

        run: |

          aws s3 sync . s3://marketingapp-web \

            --delete \

            --exclude ".git/*" \

            --exclude ".github/*"
